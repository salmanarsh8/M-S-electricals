<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MS Electricals</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    header {
      background: #111827;
      color: white;
      padding: 35px 15px;
    }

    h1 {
      margin: 0;
      font-size: 36px;
    }

    .line {
      height: 4px;
      margin: 12px auto;
      width: 180px;
      background: linear-gradient(
        to right,
        #ff9933 33%,
        white 33%,
        white 66%,
        #138808 66%
      );
    }

    p {
      font-size: 18px;
      color: #333;
    }

    .box {
      background: white;
      margin: 25px 15px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 10px #ccc;
    }

    .button {
      display: inline-block;
      background: #138808;
      color: white;
      padding: 14px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }

    footer {
      background: #111827;
      color: white;
      padding: 20px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>MS Electricals</h1>
    <div class="line"></div>
    <p style="color:white;">Electrical Work & Home Service</p>
  </header>

  <div class="box">
    <h2>Our Services</h2>
    <p>All type of home electric work</p>
    <p>All type of building electric work</p>

    <a class="button" href="tel:+918791496901">
      Call Now
    </a>
  </div>

  <footer>
    <p style="color:white;">MS Electricals</p>
    <p style="color:white;">Quality Electrical Work</p>
  </footer>

</body>
</html>
